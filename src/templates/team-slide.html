<!DOCTYPE html>
<html>
<head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Oswald:wght@400;600;700&family=Roboto:wght@400;700&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 1080px;
      height: 1920px;
      background: {{PRIMARY_COLOR}};
      font-family: 'Oswald', sans-serif;
      color: white;
      position: relative;
      overflow: hidden;
    }
    
    /* Diagonal stripes background */
    .stripes {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(
        135deg,
        {{PRIMARY_COLOR}},
        {{PRIMARY_COLOR}} 40px,
        {{SECONDARY_COLOR}} 40px,
        {{SECONDARY_COLOR}} 80px
      );
      opacity: 0.3;
    }
    
    .stripe-accent {
      position: absolute;
      top: -100px;
      right: -100px;
      width: 600px;
      height: 600px;
      background: {{SECONDARY_COLOR}};
      transform: rotate(45deg);
      opacity: 0.4;
    }
    
    .stripe-accent-2 {
      position: absolute;
      bottom: -150px;
      left: -150px;
      width: 500px;
      height: 500px;
      background: {{SECONDARY_COLOR}};
      transform: rotate(45deg);
      opacity: 0.3;
    }
    
    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      padding: 40px 60px;
    }
    
    .left-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .match-info {
      font-family: 'Roboto', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
      opacity: 0.9;
    }
    
    .team-logo-small {
      width: 70px;
      height: 70px;
      margin-bottom: 15px;
    }
    
    .team-logo-small img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .team-title {
      font-family: 'Pacifico', cursive;
      font-size: 64px;
      line-height: 1;
      margin-bottom: 30px;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
    }
    
    .player-list {
      list-style: none;
    }
    
    .player-list li {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    
    .right-side {
      display: flex;
      align-items: center;
      justify-content: center;
      padding-left: 40px;
    }
    
    .photo-frame {
      width: 580px;
      height: 440px;
      border: 8px solid #fff;
      box-shadow: 
        0 20px 60px rgba(0,0,0,0.5),
        0 0 0 4px {{SECONDARY_COLOR}};
      transform: rotate(2deg);
      overflow: hidden;
      background: #222;
    }
    
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .photo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      background: linear-gradient(135deg, #333, #222);
    }
  </style>
</head>
<body>
  <div class="stripes"></div>
  <div class="stripe-accent"></div>
  <div class="stripe-accent-2"></div>
  
  <div class="content">
    <div class="left-side">
      <div class="match-info">{{MATCH_DATE}}<br>{{TEAM_NAME}} vs {{OPPONENT}}</div>
      <div class="team-logo-small">{{LOGO}}</div>
      <div class="team-title">Team</div>
      <ul class="player-list">
        {{PLAYER_LIST}}
      </ul>
    </div>
    
    <div class="right-side">
      <div class="photo-frame">
        {{TEAM_PHOTO}}
      </div>
    </div>
  </div>
</body>
</html>
