<!DOCTYPE html>
<html>
<head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Oswald:wght@400;600;700&family=Roboto:wght@400;700&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 1080px;
      height: 1920px;
      background: {{PRIMARY_COLOR}};
      font-family: 'Oswald', sans-serif;
      color: white;
      position: relative;
      overflow: hidden;
    }
    
    /* Diagonal stripes background */
    .stripes {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(
        135deg,
        {{PRIMARY_COLOR}},
        {{PRIMARY_COLOR}} 40px,
        {{SECONDARY_COLOR}} 40px,
        {{SECONDARY_COLOR}} 80px
      );
      opacity: 0.3;
    }
    
    .stripe-accent {
      position: absolute;
      top: -100px;
      right: -100px;
      width: 600px;
      height: 600px;
      background: {{SECONDARY_COLOR}};
      transform: rotate(45deg);
      opacity: 0.4;
    }
    
    .stripe-accent-2 {
      position: absolute;
      bottom: -150px;
      left: -150px;
      width: 500px;
      height: 500px;
      background: {{SECONDARY_COLOR}};
      transform: rotate(45deg);
      opacity: 0.3;
    }
    
    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 40px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .team-logo-small {
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
    }
    
    .team-logo-small img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .team-title {
      font-family: 'Pacifico', cursive;
      font-size: 80px;
      line-height: 1;
      margin-bottom: 15px;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
    }
    
    .match-info {
      font-family: 'Roboto', sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.9;
    }
    
    .photo-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    
    .photo-frame {
      width: 960px;
      height: 720px;
      border: 10px solid #fff;
      box-shadow: 
        0 30px 80px rgba(0,0,0,0.5),
        0 0 0 5px {{SECONDARY_COLOR}};
      transform: rotate(-1deg);
      overflow: hidden;
      background: #222;
    }
    
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .photo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 120px;
      background: linear-gradient(135deg, #333, #222);
    }
    
    .player-list-container {
      margin-top: 40px;
      text-align: center;
    }
    
    .player-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px 30px;
      max-width: 900px;
    }
    
    .player-list li {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 1px;
      background: rgba(0,0,0,0.3);
      padding: 8px 20px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="stripes"></div>
  <div class="stripe-accent"></div>
  <div class="stripe-accent-2"></div>
  
  <div class="content">
    <div class="header">
      <div class="team-logo-small">{{LOGO}}</div>
      <div class="team-title">The Team</div>
      <div class="match-info">{{TEAM_NAME}} vs {{OPPONENT}} · {{MATCH_DATE}}</div>
    </div>
    
    <div class="photo-container">
      <div class="photo-frame">
        {{TEAM_PHOTO}}
      </div>
    </div>
    
    <div class="player-list-container">
      <ul class="player-list">
        {{PLAYER_LIST}}
      </ul>
    </div>
  </div>
</body>
</html>
