<!DOCTYPE html>
<html>
<head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Oswald:wght@400;600;700&family=Roboto:wght@400;700&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 1080px;
      height: 1920px;
      background: {{PRIMARY_COLOR}};
      font-family: 'Oswald', sans-serif;
      color: white;
      position: relative;
      overflow: hidden;
    }
    
    /* Diagonal stripes background */
    .stripes {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(
        135deg,
        {{PRIMARY_COLOR}},
        {{PRIMARY_COLOR}} 40px,
        {{SECONDARY_COLOR}} 40px,
        {{SECONDARY_COLOR}} 80px
      );
      opacity: 0.3;
    }
    
    .stripe-accent {
      position: absolute;
      top: -100px;
      right: -100px;
      width: 600px;
      height: 600px;
      background: {{SECONDARY_COLOR}};
      transform: rotate(45deg);
      opacity: 0.4;
    }
    
    .stripe-accent-2 {
      position: absolute;
      bottom: -150px;
      left: -150px;
      width: 500px;
      height: 500px;
      background: {{SECONDARY_COLOR}};
      transform: rotate(45deg);
      opacity: 0.3;
    }
    
    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 80px 40px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 50px;
    }
    
    .potm-title {
      font-family: 'Pacifico', cursive;
      font-size: 90px;
      line-height: 1;
      margin-bottom: 10px;
      text-shadow: 4px 4px 8px rgba(0,0,0,0.3);
    }
    
    .potm-subtitle {
      font-family: 'Oswald', sans-serif;
      font-size: 48px;
      font-weight: 400;
      letter-spacing: 8px;
      text-transform: uppercase;
    }
    
    .photo-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    
    .photo-frame {
      width: 700px;
      height: 900px;
      border: 12px solid #fff;
      box-shadow: 
        0 30px 80px rgba(0,0,0,0.5),
        0 0 0 6px {{SECONDARY_COLOR}},
        0 0 100px rgba(255,215,0,0.3);
      transform: rotate(2deg);
      overflow: hidden;
      background: #222;
    }
    
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .photo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 150px;
      background: linear-gradient(135deg, #333, #222);
    }
    
    .player-info {
      margin-top: 50px;
      text-align: center;
    }
    
    .player-name-banner {
      background: rgba(0,0,0,0.5);
      padding: 25px 60px;
      display: inline-block;
      font-size: 56px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 6px;
      border-left: 8px solid {{SECONDARY_COLOR}};
      border-right: 8px solid {{SECONDARY_COLOR}};
      margin-bottom: 20px;
    }
    
    .match-info {
      font-family: 'Roboto', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.9;
    }
    
    .team-logo {
      position: absolute;
      bottom: 40px;
      right: 40px;
      width: 100px;
      height: 100px;
    }
    
    .team-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    /* Star decorations */
    .stars {
      position: absolute;
      top: 60px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 40px;
      letter-spacing: 20px;
    }
  </style>
</head>
<body>
  <div class="stripes"></div>
  <div class="stripe-accent"></div>
  <div class="stripe-accent-2"></div>
  
  <div class="stars">⭐ ⭐ ⭐</div>
  
  <div class="content">
    <div class="header">
      <div class="potm-title">Player</div>
      <div class="potm-subtitle">of the Match</div>
    </div>
    
    <div class="photo-container">
      <div class="photo-frame">
        {{PHOTO}}
      </div>
    </div>
    
    <div class="player-info">
      <div class="player-name-banner">{{PLAYER_NAME}}</div>
      <div class="match-info">{{TEAM_NAME}} vs {{OPPONENT}} · {{MATCH_DATE}}</div>
    </div>
    
    <div class="team-logo">
      {{LOGO}}
    </div>
  </div>
</body>
</html>
