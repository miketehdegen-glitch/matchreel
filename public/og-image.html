<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #0f1923 0%, #1a2a3a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
    }
    .logo {
      font-size: 80px;
      font-weight: 800;
      margin-bottom: 30px;
    }
    .logo span { color: #00ff88; }
    .tagline {
      font-size: 36px;
      color: #8899a6;
      margin-bottom: 40px;
    }
    .cta {
      background: linear-gradient(90deg, #00ff88, #00d4ff);
      color: #0f1923;
      padding: 20px 50px;
      border-radius: 50px;
      font-size: 28px;
      font-weight: 700;
    }
    .icons {
      margin-top: 40px;
      font-size: 60px;
    }
  </style>
</head>
<body>
  <div class="logo">⚽ Match<span>Reel</span></div>
  <div class="tagline">Upload your clips. Get epic highlights.</div>
  <div class="cta">📹 Tap to Upload</div>
  <div class="icons">🎬 ⚽ 🏆</div>
</body>
</html>
