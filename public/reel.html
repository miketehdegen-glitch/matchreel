<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your MatchReel is Ready!</title>
  <meta property="og:title" content="Match Highlights Ready! ⚽">
  <meta property="og:description" content="Watch the highlights and share with friends">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f1923 0%, #1a2a3a 100%);
      min-height: 100vh;
      color: #fff;
    }
    
    .container { max-width: 500px; margin: 0 auto; padding: 30px 20px; }
    
    .header { text-align: center; margin-bottom: 25px; }
    .logo { font-size: 1.5rem; font-weight: 800; }
    .logo span { color: #00ff88; }
    
    .match-card {
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      overflow: hidden;
    }
    
    .video-preview {
      position: relative;
      background: #000;
      aspect-ratio: 16/9;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .video-preview video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: pointer;
    }
    
    .video-preview.locked::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
    }
    
    .lock-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
    }
    
    .lock-icon {
      font-size: 4rem;
      margin-bottom: 15px;
    }
    
    .lock-text {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }
    
    .preview-badge {
      background: rgba(255,255,255,0.2);
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.8rem;
    }
    
    .match-info {
      padding: 25px;
      text-align: center;
    }
    
    .teams {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 10px;
    }
    
    .teams .vs { color: #00ff88; margin: 0 10px; }
    
    .score {
      font-size: 2.5rem;
      font-weight: 800;
      color: #00ff88;
      margin: 15px 0;
    }
    
    .score .divider { color: #8899a6; margin: 0 15px; }
    
    .match-date {
      color: #8899a6;
      margin-bottom: 20px;
    }
    
    .highlights {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    
    .highlight-stat {
      text-align: center;
    }
    
    .highlight-stat .icon { font-size: 1.5rem; }
    .highlight-stat .value { font-weight: 700; color: #00ff88; }
    .highlight-stat .label { font-size: 0.8rem; color: #8899a6; }
    
    .potm {
      background: rgba(255,215,0,0.1);
      border: 1px solid rgba(255,215,0,0.3);
      padding: 15px;
      border-radius: 12px;
      margin: 20px 0;
    }
    
    .potm .label { color: #8899a6; font-size: 0.9rem; }
    .potm .name { font-size: 1.2rem; font-weight: 700; color: #ffd700; }
    
    .btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 10px;
    }
    
    .btn:hover { transform: scale(1.02); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    
    .btn-unlock {
      background: linear-gradient(90deg, #00ff88, #00d4ff);
      color: #0f1923;
    }
    
    .btn-download {
      background: #00ff88;
      color: #0f1923;
    }
    
    .btn-share {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
    
    .price-info {
      text-align: center;
      margin-top: 15px;
      color: #8899a6;
      font-size: 0.9rem;
    }
    
    .unlocked-banner {
      background: linear-gradient(90deg, #00ff88, #00d4ff);
      color: #0f1923;
      text-align: center;
      padding: 12px;
      font-weight: 700;
      display: none;
    }
    
    .unlocked-banner.show { display: block; }
    
    .unlocked-by {
      text-align: center;
      color: #8899a6;
      font-size: 0.9rem;
      margin-top: 10px;
    }
    
    .team-of-day {
      margin: 20px 0;
      padding: 15px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
    }
    
    .team-of-day h4 {
      color: #00d4ff;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }
    
    .team-of-day .players {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .team-of-day .player {
      background: rgba(255,255,255,0.1);
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="unlocked-banner" id="unlockedBanner">
    ✓ UNLOCKED — Download & share!
  </div>
  
  <div class="container">
    <div class="header">
      <h1 class="logo">⚽ Match<span>Reel</span></h1>
    </div>
    
    <div class="match-card">
      <div class="video-preview" id="videoPreview">
        <video id="previewVideo" loop muted playsinline autoplay>
          <source src="" type="video/mp4">
        </video>
        
        <div class="lock-overlay" id="lockOverlay">
          <div class="lock-icon">🎬</div>
          <div class="lock-text">Highlights ready to create!</div>
          <div class="preview-badge" id="clipCountBadge">0 clips</div>
        </div>
      </div>
      
      <div class="match-info">
        <div class="teams">
          <span id="teamName">Team</span>
          <span class="vs">vs</span>
          <span id="opponent">Opponent</span>
        </div>
        
        <div class="score">
          <span id="homeScore">0</span>
          <span class="divider">-</span>
          <span id="awayScore">0</span>
        </div>
        
        <div class="match-date" id="matchDate"></div>
        
        <div class="highlights">
          <div class="highlight-stat">
            <div class="icon">⚽</div>
            <div class="value" id="goalCount">0</div>
            <div class="label">Goals</div>
          </div>
          <div class="highlight-stat">
            <div class="icon">🔥</div>
            <div class="value" id="skillsCount">0</div>
            <div class="label">Skills</div>
          </div>
          <div class="highlight-stat">
            <div class="icon">🧤</div>
            <div class="value" id="saveCount">0</div>
            <div class="label">Saves</div>
          </div>
        </div>
        
        <div class="potm" id="potmSection" style="display:none;">
          <div class="label">⭐ Player of the Match</div>
          <div class="name" id="potmName"></div>
        </div>
        
        <div class="team-of-day" id="todSection" style="display:none;">
          <h4>🏆 Team of the Day</h4>
          <div class="players" id="todPlayers"></div>
        </div>
        
        <!-- Locked state -->
        <div id="lockedButtons">
          <!-- Voucher code input -->
          <div style="margin-bottom: 15px;">
            <div style="display: flex; gap: 10px;">
              <input type="text" id="voucherCode" placeholder="Got a voucher code?" 
                style="flex: 1; padding: 12px 15px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: #fff; text-transform: uppercase;">
              <button onclick="applyVoucher()" style="padding: 12px 20px; border-radius: 8px; border: none; background: #ffa502; color: #0f1923; font-weight: 600; cursor: pointer;">Apply</button>
            </div>
            <p id="voucherMessage" style="font-size: 0.85rem; margin-top: 8px; display: none;"></p>
          </div>
          
          <button class="btn btn-unlock" onclick="unlockReel()">
            🎬 Create & Unlock — <span id="priceDisplay">£3</span>
          </button>
          <p class="price-info">Pay once, video created for the whole group to share!</p>
        </div>
        
        <!-- Processing state -->
        <div id="processingButtons" style="display:none;">
          <button class="btn btn-unlock" disabled>
            ⏳ Creating your video...
          </button>
          <p class="price-info">This takes 2-5 minutes. We'll update this page when ready!</p>
        </div>
        
        <!-- Unlocked state -->
        <div id="unlockedButtons" style="display:none;">
          <button class="btn btn-download" onclick="downloadReel()">
            ⬇️ Download Video
          </button>
          <button class="btn btn-share" onclick="shareReel()">
            📤 Share
          </button>
          <p class="unlocked-by" id="unlockedBy"></p>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    const matchId = window.location.pathname.split('/').pop();
    const urlParams = new URLSearchParams(window.location.search);
    const justPaid = urlParams.get('paid') === 'true';
    let matchData = null;
    
    async function loadMatch() {
      try {
        const res = await fetch(`/api/matches/${matchId}`);
        const data = await res.json();
        
        if (data.success) {
          matchData = data.match;
          renderMatch();
        }
      } catch (err) {
        console.error('Failed to load:', err);
      }
    }
    
    function renderMatch() {
      document.getElementById('teamName').textContent = matchData.teamName;
      document.getElementById('opponent').textContent = matchData.opponent;
      document.getElementById('matchDate').textContent = formatDate(matchData.matchDate);
      
      if (matchData.score) {
        document.getElementById('homeScore').textContent = matchData.score.home;
        document.getElementById('awayScore').textContent = matchData.score.away;
      }
      
      const clips = matchData.clips || [];
      document.getElementById('goalCount').textContent = clips.filter(c => c.type === 'goal').length;
      document.getElementById('skillsCount').textContent = clips.filter(c => c.type === 'skills').length;
      document.getElementById('saveCount').textContent = clips.filter(c => c.type === 'save').length;
      document.getElementById('clipCountBadge').textContent = `${clips.length} clips`;
      
      if (matchData.playerOfMatch) {
        document.getElementById('potmSection').style.display = 'block';
        document.getElementById('potmName').textContent = matchData.playerOfMatch;
      }
      
      if (matchData.teamOfDay?.length > 0) {
        document.getElementById('todSection').style.display = 'block';
        document.getElementById('todPlayers').innerHTML = matchData.teamOfDay
          .map(p => `<span class="player">${p}</span>`).join('');
      }
      
      // Check status
      if (matchData.unlocked) {
        if (matchData.status === 'complete') {
          showUnlocked();
        } else if (matchData.status === 'processing') {
          showProcessing();
        } else {
          // Unlocked but not started - trigger generation
          triggerGeneration();
        }
      } else if (justPaid) {
        // Just returned from Stripe - wait a moment for webhook, then check again
        showProcessing();
        document.querySelector('#processingButtons .price-info').textContent = 'Processing payment...';
        setTimeout(async () => {
          await loadMatch();
          // If still not unlocked after 5s, poll
          if (!matchData.unlocked) {
            pollForUnlock();
          }
        }, 3000);
      } else if (matchData.status === 'processing') {
        showProcessing();
      } else if (matchData.status === 'complete' && matchData.unlocked) {
        showUnlocked();
      }
      
      // Load preview video if available
      if (matchData.previewUrl) {
        document.getElementById('previewVideo').src = matchData.previewUrl;
        document.getElementById('previewVideo').play();
      }
    }
    
    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('en-GB', {
        weekday: 'long',
        day: 'numeric',
        month: 'long'
      });
    }
    
    function showProcessing() {
      document.getElementById('lockOverlay').innerHTML = `
        <div class="lock-icon">⏳</div>
        <div class="lock-text">Creating your video...</div>
        <div class="preview-badge">2-5 minutes</div>
      `;
      document.getElementById('lockedButtons').style.display = 'none';
      document.getElementById('processingButtons').style.display = 'block';
      
      // Poll for completion
      setTimeout(() => loadMatch(), 10000);
    }
    
    function showUnlocked() {
      document.getElementById('unlockedBanner').classList.add('show');
      document.getElementById('lockOverlay').style.display = 'none';
      document.getElementById('videoPreview').classList.remove('locked');
      document.getElementById('lockedButtons').style.display = 'none';
      document.getElementById('unlockedButtons').style.display = 'block';
      
      // Load and autoplay the video
      const video = document.getElementById('previewVideo');
      video.src = `/api/matches/${matchId}/download`;
      video.muted = false;
      video.play();
      
      if (matchData.unlockedBy) {
        document.getElementById('unlockedBy').textContent = `Unlocked by ${matchData.unlockedBy}`;
      }
    }
    
    let appliedVoucher = null;
    let currentPrice = 3;
    
    async function applyVoucher() {
      const code = document.getElementById('voucherCode').value.trim().toUpperCase();
      const msgEl = document.getElementById('voucherMessage');
      
      if (!code) {
        msgEl.textContent = 'Please enter a voucher code';
        msgEl.style.color = '#ff4757';
        msgEl.style.display = 'block';
        return;
      }
      
      try {
        const res = await fetch(`/api/vouchers/validate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, matchId })
        });
        
        const data = await res.json();
        
        if (data.valid) {
          appliedVoucher = data;
          currentPrice = data.newPrice;
          
          if (data.discount === 100) {
            msgEl.innerHTML = '🎉 <strong>FREE VIDEO!</strong> Code applied';
            document.getElementById('priceDisplay').textContent = 'FREE';
          } else {
            msgEl.innerHTML = `✓ ${data.discount}% off applied!`;
            document.getElementById('priceDisplay').textContent = `£${data.newPrice}`;
          }
          msgEl.style.color = '#00ff88';
          
          document.getElementById('voucherCode').disabled = true;
        } else {
          msgEl.textContent = data.error || 'Invalid voucher code';
          msgEl.style.color = '#ff4757';
        }
        msgEl.style.display = 'block';
        
      } catch (err) {
        msgEl.textContent = 'Failed to validate code';
        msgEl.style.color = '#ff4757';
        msgEl.style.display = 'block';
      }
    }
    
    async function unlockReel() {
      // If voucher makes it free, unlock and generate
      if (appliedVoucher && appliedVoucher.discount === 100) {
        try {
          // Unlock with voucher
          const unlockRes = await fetch(`/api/matches/${matchId}/unlock`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              voucherCode: appliedVoucher.code,
              unlockedBy: 'Voucher: ' + appliedVoucher.code
            })
          });
          
          const unlockData = await unlockRes.json();
          if (!unlockData.success) {
            alert('Error: ' + unlockData.error);
            return;
          }
          
          // Now trigger video generation
          await triggerGeneration();
          
        } catch (err) {
          alert('Failed to unlock: ' + err.message);
        }
        return;
      }
      
      // Create Stripe checkout session and redirect
      try {
        const res = await fetch('/api/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            matchId,
            voucherCode: appliedVoucher?.code || null
          })
        });
        
        const data = await res.json();
        
        if (data.success && data.url) {
          // Redirect to Stripe Checkout
          window.location.href = data.url;
        } else {
          alert('Payment error: ' + (data.error || 'Unknown error'));
        }
      } catch (err) {
        alert('Failed to start checkout: ' + err.message);
      }
    }
    
    async function triggerGeneration() {
      // Show processing state
      showProcessing();
      
      try {
        // Trigger video generation
        const genRes = await fetch(`/api/matches/${matchId}/generate-public`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ matchId })
        });
        
        const genData = await genRes.json();
        if (genData.success) {
          // Poll for completion
          pollForVideo();
        } else {
          alert('Generation failed: ' + genData.error);
          location.reload();
        }
      } catch (err) {
        alert('Failed to start generation: ' + err.message);
        location.reload();
      }
    }
    
    function pollForUnlock() {
      const checkUnlock = async () => {
        try {
          const res = await fetch(`/api/matches/${matchId}`);
          const data = await res.json();
          
          if (data.match?.unlocked) {
            matchData = data.match;
            // Now trigger video generation
            triggerGeneration();
            return;
          }
          
          // Keep polling
          setTimeout(checkUnlock, 2000);
        } catch (err) {
          setTimeout(checkUnlock, 2000);
        }
      };
      
      checkUnlock();
    }
    
    function pollForVideo() {
      const checkStatus = async () => {
        try {
          const res = await fetch(`/api/matches/${matchId}/status`);
          const data = await res.json();
          
          if (data.status === 'complete') {
            showUnlocked();
            return;
          } else if (data.status === 'failed') {
            alert('Video generation failed. Please contact support.');
            location.reload();
            return;
          }
          
          // Keep polling
          setTimeout(checkStatus, 5000);
        } catch (err) {
          setTimeout(checkStatus, 5000);
        }
      };
      
      setTimeout(checkStatus, 3000);
    }
    
    // Allow Enter key to apply voucher
    document.getElementById('voucherCode')?.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') applyVoucher();
    });
    
    function downloadReel() {
      window.location.href = `/api/matches/${matchId}/download`;
    }
    
    function shareReel() {
      const url = window.location.href;
      const text = `Check out our match highlights! ${matchData.teamName} vs ${matchData.opponent}`;
      
      if (navigator.share) {
        navigator.share({ title: 'MatchReel', text, url });
      } else {
        navigator.clipboard.writeText(url);
        alert('Link copied!');
      }
    }
    
    loadMatch();
  </script>
</body>
</html>
