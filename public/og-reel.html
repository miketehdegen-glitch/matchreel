<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #0a0f18 0%, #1a1a2e 50%, #0f1923 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
    }
    .icon { font-size: 100px; margin-bottom: 20px; }
    h1 { 
      font-size: 72px; 
      margin-bottom: 20px;
      background: linear-gradient(90deg, #ffd700, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { font-size: 36px; color: #00ff88; font-weight: 600; }
    .logo {
      position: absolute;
      bottom: 40px;
      font-size: 28px;
      font-weight: 800;
    }
    .logo span { color: #00ff88; }
  </style>
</head>
<body>
  <div class="icon">🏆</div>
  <h1>Highlights Ready!</h1>
  <p>Tap to Watch</p>
  <div class="logo">⚽ Match<span>Reel</span></div>
</body>
</html>
